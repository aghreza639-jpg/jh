   <h1>فرم ثبت نام</h1>

    <form>

        <label>نام و نام‌خانوادگی :</label>
        <input type="text" placeholder="نام و نام‌خانوادگی خود را وارد کنید" required>

        <br><br>

        <label>شماره تلفن :</label>
        <input type="tel" required>

        <br><br>

        <label>ایمیل :</label>
        <input type="email">

        <br><br>

        <label>رمز عبور :</label>
        <input type="password" required>

        <br><br>

        <label>سن :</label>
        <input type="number">

        <br><br>

        <label>جنسیت :</label><br>


        <label><input type="radio" name="gender">
        مرد
        </label>

        <label><input type="radio" name="gender">
        زن
        </label>

        <br><br>

        <label>شهر :</label>

        <select>
            <option>اراک</option>
            <option>یزد</option>
            <option>تهران</option>
            <option>ابادان</option>
        </select>

        <br><br>

        <label>مهارت‌ها :</label>


        <label><input type="checkbox">HTML</label>


        <label><input type="checkbox">CSS</label>


        <label><input type="checkbox">Python</label>

        <br><br>

        <label>توضیحات :</label>

        <br>

        <textarea></textarea>

        <br><br>

        <button>ثبت نام</button>

    </form>
